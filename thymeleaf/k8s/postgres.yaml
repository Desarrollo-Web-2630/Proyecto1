# Base de datos PostgreSQL del sistema, con disco persistente.
# Las credenciales salen del Secret procesos-secrets (no se escriben aqui).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: procesos-db-datos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procesos-db
spec:
  replicas: 1
  # Recreate: dos pods de Postgres no pueden usar el mismo disco a la vez
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: procesos-db
  template:
    metadata:
      labels:
        app: procesos-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: procesos-secrets
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: procesos-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: procesos-secrets
                  key: DB_PASSWORD
            # Subcarpeta: el volumen trae un lost+found que Postgres no acepta
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: procesos-db-datos
---
apiVersion: v1
kind: Service
metadata:
  name: procesos-db
spec:
  selector:
    app: procesos-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
