$kind: collection
description: Colección con los endpoints principales del backend para pruebas en Postman. Variable `baseUrl` usada para la URL base.
variables:
  baseUrl: http://localhost:8080
scripts:
  - type: http:beforeRequest
    code: |-
      // Entrega final: la empresa y el rol salen del JWT; se adjunta el token guardado por el login.
      var token = pm.collectionVariables.get('token');
      if (token) {
        pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + token });
      }
    language: text/javascript
