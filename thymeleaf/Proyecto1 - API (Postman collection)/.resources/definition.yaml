$kind: collection
description: Colección con los endpoints principales del backend para pruebas en Postman. Variable `baseUrl` usada para la URL base.
variables:
  baseUrl: http://localhost:8080
scripts:
  - type: http:beforeRequest
    code: |-
      // Entrega final: cada peticion lleva el JWT que guardo el request 'Login'.
      // La empresa ya no se elige: el backend la toma del token.
      var jwt = pm.environment.get('jwt');
      if (jwt) { pm.request.headers.upsert({ key: 'Authorization', value: 'Bearer ' + jwt }); }
    language: text/javascript
