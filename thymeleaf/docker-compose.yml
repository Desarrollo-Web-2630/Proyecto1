services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: procesos
      POSTGRES_USER: procesos
      POSTGRES_PASSWORD: procesos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procesos -d procesos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      network: host
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: procesos
      DB_USER: procesos
      DB_PASSWORD: procesos
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      APP_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
