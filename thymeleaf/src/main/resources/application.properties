spring.application.name=thymeleaf

# ==========================================
# Configuracion por defecto (produccion / sin perfil)
# ==========================================
# Nunca se versionan credenciales reales aqui. Todo sale de variables de
# entorno; sin ellas la app no arranca, que es preferible a arrancar contra
# una base de datos por defecto insegura.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto e integracion con JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'none' o 'validate' para proteger la base de datos remota de cambios involuntarios
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

# Seguridad activa siempre por defecto; solo los perfiles de desarrollo
# (h2, local, postman) la relajan explicitamente para facilitar pruebas.
app.security.enabled=true
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}
app.mail.fail-on-error=${APP_MAIL_FAIL_ON_ERROR:false}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.backend.base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
