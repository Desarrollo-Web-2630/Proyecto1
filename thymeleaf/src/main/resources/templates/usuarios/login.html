<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Iniciar sesión')}"></head>
<body>

<main class="contenido">

    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Editor y visualizador de procesos BPMN.</p>

    <div th:replace="~{fragmentos/comunes :: mensajes}"></div>

    <form class="panel" method="post" th:object="${login}" th:action="@{/usuarios/login}">

        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" th:field="*{correo}"
                   th:classappend="${#fields.hasErrors('correo')} ? 'invalido'"
                   placeholder="ana@empresa.com" autofocus/>
            <span class="error-campo" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'invalido'"/>
            <span class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="pie-formulario">
            <button type="submit" class="boton">Entrar</button>
            <a class="boton boton-suave" th:href="@{/usuarios/nuevo}">Registrarse</a>
        </div>
    </form>

</main>

</body>
</html>
