<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Iniciar sesión')}"></head>
<body>

<main class="contenido">

    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Editor y visualizador de procesos BPMN.</p>

    <div th:replace="~{fragmentos/comunes :: mensajes}"></div>

    <form class="panel" method="post" th:action="@{/usuarios/login}">

        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required
                   placeholder="ana@empresa.com" autofocus/>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required/>
        </div>

        <div class="pie-formulario">
            <button type="submit" class="boton">Entrar</button>
            <a class="boton boton-suave" th:href="@{/usuarios/nuevo}">Registrarse</a>
        </div>
    </form>

</main>

</body>
</html>
