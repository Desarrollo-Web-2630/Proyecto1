<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arcos del proceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-4">

    <h1 class="h3 mb-4">Arcos del proceso</h1>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="alert alert-warning" th:if="${advertencias}">
        <strong>El diagrama quedó con elementos desconectados:</strong>
        <ul class="mb-0">
            <li th:each="aviso : ${advertencias}" th:text="${aviso}"></li>
        </ul>
    </div>

    <a class="btn btn-primary mb-3"
       th:href="@{'/procesos/' + ${procesoId} + '/arcos/nuevo'(empresaId=${empresaId})}">Nuevo arco</a>

    <table class="table table-striped align-middle bg-white">
        <thead>
        <tr>
            <th scope="col">Origen</th>
            <th scope="col">Destino</th>
            <th scope="col">Etiqueta</th>
            <th scope="col">Condición</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="arco : ${arcos}">
            <td>
                <span th:text="${arco.origen.nombre}">Origen</span>
                <small class="text-muted" th:text="'(' + ${arco.origen.tipoElemento} + ')'"></small>
            </td>
            <td>
                <span th:text="${arco.destino.nombre}">Destino</span>
                <small class="text-muted" th:text="'(' + ${arco.destino.tipoElemento} + ')'"></small>
            </td>
            <td th:text="${arco.nombre} ?: '—'">—</td>
            <td th:text="${arco.condicion} ?: '—'">—</td>
            <td>
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{'/procesos/' + ${procesoId} + '/arcos/' + ${arco.id} + '/editar'(empresaId=${empresaId})}">Editar</a>

                <form class="d-inline"
                      th:action="@{'/procesos/' + ${procesoId} + '/arcos/' + ${arco.id} + '/eliminar'(empresaId=${empresaId})}"
                      method="post"
                      onsubmit="return confirm('¿Eliminar este arco? El diagrama se ajustará automáticamente.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(arcos)}">
            <td colspan="5" class="text-center text-muted">Este proceso todavía no tiene arcos</td>
        </tr>
        </tbody>
    </table>

</main>
</body>
</html>
