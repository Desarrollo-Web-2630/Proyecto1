<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arco</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 640px;">

    <h1 class="h3 mb-4" th:text="${arcoForm.id} == null ? 'Nuevo arco' : 'Editar arco'">Arco</h1>

    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <form th:object="${arcoForm}" method="post"
          th:action="${arcoForm.id} == null
                     ? @{'/procesos/' + ${procesoId} + '/arcos'(empresaId=${empresaId})}
                     : @{'/procesos/' + ${procesoId} + '/arcos/' + ${arcoForm.id}(empresaId=${empresaId})}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="origenId">Origen</label>
            <select class="form-select" id="origenId" th:field="*{origenId}">
                <option value="">Seleccione un elemento</option>
                <option th:each="elemento : ${elementos}"
                        th:value="${elemento.id}"
                        th:text="${elemento.nombre} + ' (' + ${elemento.tipoElemento} + ')'"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('origenId')}" th:errors="*{origenId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="destinoId">Destino</label>
            <select class="form-select" id="destinoId" th:field="*{destinoId}">
                <option value="">Seleccione un elemento</option>
                <option th:each="elemento : ${elementos}"
                        th:value="${elemento.id}"
                        th:text="${elemento.nombre} + ' (' + ${elemento.tipoElemento} + ')'"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('destinoId')}" th:errors="*{destinoId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="nombre">Etiqueta</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="condicion">Condición</label>
            <input type="text" class="form-control" id="condicion" th:field="*{condicion}">
            <div class="form-text">Obligatoria solo si el origen es un gateway exclusivo o inclusivo. En los demás casos se ignora.</div>
            <div class="text-danger small" th:if="${#fields.hasErrors('condicion')}" th:errors="*{condicion}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-link"
           th:href="@{'/procesos/' + ${procesoId} + '/arcos'(empresaId=${empresaId})}">Cancelar</a>
    </form>

</main>
</body>
</html>
