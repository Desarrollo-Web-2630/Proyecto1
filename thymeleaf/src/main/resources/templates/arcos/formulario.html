<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Arco')}"></head>
<body>

<nav th:replace="~{fragmentos/comunes :: navegacion}"></nav>

<main class="contenido">

    <h1 th:text="${arco.id} == null ? 'Nuevo arco' : 'Editar arco'">Nuevo arco</h1>
    <p class="subtitulo">El arco fija el orden: conecta un elemento de origen con uno de destino.</p>

    <div th:replace="~{fragmentos/comunes :: mensajes}"></div>

    <p class="aviso aviso-advertencia" th:if="${#lists.isEmpty(elementos)}">
        Este proceso no tiene elementos conectables, así que todavía no se puede crear un arco.
    </p>

    <form class="panel" method="post" th:object="${arco}"
          th:action="${arco.id} == null
                     ? @{/procesos/{procesoId}/arcos/guardar(procesoId=${procesoId})}
                     : @{/procesos/{procesoId}/arcos/actualizar/{id}(procesoId=${procesoId}, id=${arco.id})}">

        <input type="hidden" th:field="*{id}"/>

        <div class="campo">
            <label for="nombre">Etiqueta</label>
            <input type="text" id="nombre" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'"
                   placeholder="Sí"/>
            <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>

        <div class="campo">
            <label for="condicion">Condición</label>
            <input type="text" id="condicion" th:field="*{condicion}"
                   th:classappend="${#fields.hasErrors('condicion')} ? 'invalido'"
                   placeholder="monto &lt;= 1000"/>
            <span class="error-campo" th:if="${#fields.hasErrors('condicion')}" th:errors="*{condicion}"></span>
            <span class="error-campo" style="color:inherit;opacity:.7">
                Solo tiene sentido si el arco sale de un gateway.
            </span>
        </div>

        <!-- La HU-12 permite cambiar los dos extremos, no solo al crear -->
        <div class="campo">
            <label for="origenId">Elemento de origen</label>
            <select id="origenId" th:field="*{origenId}"
                    th:classappend="${#fields.hasErrors('origenId')} ? 'invalido'">
                <option value="">Selecciona el origen</option>
                <option th:each="elemento : ${elementos}"
                        th:value="${elemento.id}"
                        th:text="${elemento.nombre}">Elemento</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('origenId')}" th:errors="*{origenId}"></span>
        </div>

        <div class="campo">
            <label for="destinoId">Elemento de destino</label>
            <select id="destinoId" th:field="*{destinoId}"
                    th:classappend="${#fields.hasErrors('destinoId')} ? 'invalido'">
                <option value="">Selecciona el destino</option>
                <option th:each="elemento : ${elementos}"
                        th:value="${elemento.id}"
                        th:text="${elemento.nombre}">Elemento</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('destinoId')}" th:errors="*{destinoId}"></span>
        </div>

        <div class="pie-formulario">
            <button type="submit" class="boton">Guardar</button>
            <a class="boton boton-suave"
               th:href="@{/procesos/{procesoId}/arcos(procesoId=${procesoId})}">Cancelar</a>
        </div>
    </form>

</main>

</body>
</html>
