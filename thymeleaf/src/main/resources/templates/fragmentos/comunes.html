<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Fragmentos reutilizables por todas las vistas.
  Se incluyen con th:replace="~{fragmentos/comunes :: nombreFragmento}".
-->

<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo}">Editor de Procesos BPMN</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>

<body>

<nav th:fragment="navegacion" class="barra">
    <a class="marca" th:href="@{/}">Editor BPMN</a>
    <a th:href="@{/procesos}">Procesos</a>
    <a th:href="@{/empresas}">Empresas</a>
    <a th:href="@{/usuarios}">Usuarios</a>
    <form class="barra-salir" th:action="@{/usuarios/logout}" method="post">
        <button type="submit" class="enlace">Cerrar sesión</button>
    </form>
</nav>

<div th:fragment="mensajes">
    <p class="aviso aviso-exito" th:if="${mensajeExito}" th:text="${mensajeExito}"></p>
    <p class="aviso aviso-error" th:if="${mensajeError}" th:text="${mensajeError}"></p>
    <p class="aviso aviso-advertencia" th:if="${mensajeAdvertencia}" th:text="${mensajeAdvertencia}"></p>
</div>

</body>
</html>
