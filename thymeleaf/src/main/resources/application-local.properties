# Perfil local - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mibd_local
spring.datasource.username=user1
spring.datasource.password=sa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.security.enabled=false
app.security.jwt.secret=test-secret-key-must-be-long-enough-for-hs512-algorithm-12345
app.security.jwt.expiration-ms=3600000

# ==== Correo (activar para pruebas locales con Gmail u otro SMTP) ====
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}
app.mail.fail-on-error=${APP_MAIL_FAIL_ON_ERROR:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
