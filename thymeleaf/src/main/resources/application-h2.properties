# Perfil H2 en memoria (útil para pruebas unitarias/rápidas)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# La seguridad no se puede desactivar: el token se obtiene con POST /api/v1/usuarios/login
# y la coleccion de Postman lo captura sola. Ver README.
app.security.jwt.secret=test-secret-key-must-be-long-enough-for-hs512-algorithm-12345
app.security.jwt.expiration-ms=3600000
