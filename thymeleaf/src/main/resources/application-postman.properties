# Perfil 'postman' — pensado para desarrollo/pruebas con Postman
spring.application.name=thymeleaf-postman

# Datos de conexión — se leen de variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thymeleaf}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Seguridad: deshabilitado para pruebas con Postman (activar en staging/producción)
app.security.enabled=false
app.security.jwt.secret=${JWT_SECRET:change_me}
app.security.jwt.expiration-ms=86400000

# Logging para debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.proyecto1=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ============= Correo (opcional) =============
# Para enviar correos de verificación necesitas credenciales SMTP válidas.
# Si no quieres enviar correos durante las pruebas, deja APP_MAIL_ENABLED=false
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:you@example.com}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Nota: este archivo usa variables de entorno (ej: DB_HOST). Rellena .env o exporta variables antes de ejecutar.
